# =============================================================================
# Security Scan — Automated Vulnerability Scanning
#
# Trigger:
#   - Schedule: every Monday at 09:00 UTC
#   - Manual: workflow_dispatch (via GitHub UI or gh CLI)
#
# Scans:
#   - pip-audit  : Python dependency vulnerabilities
#   - npm audit  : Frontend dependency vulnerabilities
# =============================================================================
name: Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"   # 每周一 UTC 09:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: uv pip install --system pip-audit

      - name: pip-audit (Python dependencies)
        run: pip-audit --strict
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (Frontend dependencies)
        run: npm audit --audit-level=high
        working-directory: frontend/
        continue-on-error: true
