name: codeagent

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: uvicorn codeagent.interaction.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      USE_INLINE_RUNNER: "true"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4-flash}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - workspace:/workspace
    restart: unless-stopped

  worker:
    profiles: ["distributed"]
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: celery -A codeagent.worker worker --loglevel=info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - workspace:/workspace

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  nginx:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  redis_data:
  workspace:
