[project]
name = "codeagent"
version = "0.1.0"
description = "AI-powered coding assistant with multi-agent orchestration"
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.1.0",
    "langgraph>=1.1.0",
    "litellm>=1.83.0",
    "lancedb>=0.10.0",
    "sentence-transformers>=5.4.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "networkx>=3.3",
    "structlog>=24.0.0",
    "pydantic>=2.13.0",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "celery[redis]>=5.4.0",
    "redis[asyncio]>=5.0.0",
    "websockets>=12.0",
]

[project.scripts]
codeagent = "codeagent.interaction.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.0",
    "mypy>=2.0.0",
    "bandit>=1.7.0",
    "fakeredis>=2.23.0",
    "httpx>=0.27.0",
    "pytest-playwright>=0.5.0",
]
sandbox = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.25.0",
    "docker>=7.0.0",
]
persistence = [
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[dependency-groups]
dev = [{include = "dev"}, {include = "sandbox"}, {include = "persistence"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "e2e: marks end-to-end integration tests (requires LLM API key)",
    "requires_network: marks integration tests that require network access",
    "docker: marks integration tests that require Docker daemon",
    "slow: marks slow tests excluded from main CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
