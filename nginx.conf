# =============================================================================
# CodeAgent — Nginx 反向代理配置
#
# 职责:
#   - 托管 React SPA 静态文件
#   - 反向代理 REST API 请求到 FastAPI
#   - 代理 WebSocket 连接（含 Upgrade 头）
# =============================================================================

upstream api_servers {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    charset utf-8;

    # ── Gzip 压缩 ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── 静态前端 SPA ──────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # 带 hash 的静态资源（JS/CSS 文件名包含 hash）使用强缓存
        location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # index.html 不缓存（确保每次获取最新版本）
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # ── REST API 反向代理 ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── WebSocket 流式输出代理 ────────────────────────────────────────
    location ~ ^/api/v1/tasks/[^/]+/stream$ {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── 健康检查 ──────────────────────────────────────────────────────
    location /health {
        proxy_pass http://api_servers/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ── 安全: 阻止访问隐藏文件 ────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── 日志格式 ──────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
